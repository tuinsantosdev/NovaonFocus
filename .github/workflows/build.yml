name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # para publicar a versão quando uma tag v* é enviada

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Só os headers do libobs; a lib de importação sai de obs-plugin/obs.def.
      - name: Headers do OBS
        run: |
          git clone --depth 1 --filter=blob:none --sparse --branch 31.0.0 https://github.com/obsproject/obs-studio obs-src
          git -C obs-src sparse-checkout set libobs

      # VST3 SDK (MIT): só os submódulos que o plugin usa.
      - name: VST3 SDK
        run: |
          git -c advice.detachedHead=false clone --depth 1 --branch v3.8.0_build_66 https://github.com/steinbergmedia/vst3sdk vst3sdk
          git -C vst3sdk submodule update --init --depth 1 base pluginterfaces public.sdk

      - name: Configurar
        run: >
          cmake -S . -B build -A x64
          -DNOVAON_BUILD_OBS_PLUGIN=ON -DNOVAON_OBS_SOURCE_DIR="${{ github.workspace }}/obs-src"
          -DNOVAON_BUILD_VST=ON -DNOVAON_VST3_SDK_DIR="${{ github.workspace }}/vst3sdk"

      - name: Compilar
        run: cmake --build build --config Release

      - name: Teste do reamostrador
        run: ./build/Release/resampler_test.exe

      - name: Teste de ponta a ponta (plugin VST3 -> app -> bus)
        working-directory: build/vst-plugin/Release
        run: ./send_smoke.exe novaonfocus-send.vst3

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: send-view-preview
          path: build/vst-plugin/Release/send_view.bmp
          if-no-files-found: ignore

      - name: Empacotar
        run: cmake --install build --config Release --prefix dist

      - uses: actions/upload-artifact@v4
        with:
          name: NovaonFocus-windows-x64
          path: dist/

      - name: Instalador
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            choco install innosetup -y --no-progress
            $env:PATH += ";${env:ProgramFiles(x86)}\Inno Setup 6"
          }
          $v = (Select-String -Path CMakeLists.txt -Pattern 'project\(NovaonFocus VERSION ([0-9.]+)').Matches[0].Groups[1].Value
          "NOVAON_VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append
          iscc /DAppVersion=$v "/DSourceDir=${{ github.workspace }}\dist" installer\novaonfocus.iss

      - uses: actions/upload-artifact@v4
        with:
          name: NovaonFocus-Setup
          path: installer/output/*.exe

      # Ao publicar a versão pelo GitHub (Releases > Draft a new release, tag
      # vX.Y.Z), a tag dispara este build e o instalador é anexado a ela.
      - name: Publicar versão
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $exe = "installer/output/NovaonFocus-$env:NOVAON_VERSION-Setup.exe"
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $exe --clobber
          } else {
            gh release create $tag $exe --title "NovaonFocus $tag" --notes-file installer/RELEASE_NOTES.md
          }
