name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # Só os headers do libobs; a lib de importação sai de obs-plugin/obs.def.
      - name: Headers do OBS
        run: |
          git clone --depth 1 --filter=blob:none --sparse --branch 31.0.0 https://github.com/obsproject/obs-studio obs-src
          git -C obs-src sparse-checkout set libobs

      # VST3 SDK (MIT): só os submódulos que o plugin usa.
      - name: VST3 SDK
        run: |
          git -c advice.detachedHead=false clone --depth 1 --branch v3.8.0_build_66 https://github.com/steinbergmedia/vst3sdk vst3sdk
          git -C vst3sdk submodule update --init --depth 1 base pluginterfaces public.sdk

      - name: Configurar
        run: >
          cmake -S . -B build -A x64
          -DNOVAON_BUILD_OBS_PLUGIN=ON -DNOVAON_OBS_SOURCE_DIR="${{ github.workspace }}/obs-src"
          -DNOVAON_BUILD_VST=ON -DNOVAON_VST3_SDK_DIR="${{ github.workspace }}/vst3sdk"

      - name: Compilar
        run: cmake --build build --config Release

      - name: Teste do reamostrador
        run: ./build/Release/resampler_test.exe

      - name: Teste de ponta a ponta (plugin VST3 -> app -> bus)
        working-directory: build/vst-plugin/Release
        run: ./send_smoke.exe novaonfocus-send.vst3

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: send-view-preview
          path: build/vst-plugin/Release/send_view.bmp
          if-no-files-found: ignore

      - name: Empacotar
        run: cmake --install build --config Release --prefix dist

      - uses: actions/upload-artifact@v4
        with:
          name: NovaonFocus-windows-x64
          path: dist/
