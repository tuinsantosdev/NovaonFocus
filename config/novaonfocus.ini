# Configuração de exemplo do NovaonFocus.
# Rode "novaonfocus devices" e "novaonfocus apps" para ver os nomes certos.

[engine]
# Folga de cada fonte em milissegundos. Menor = menos atraso; se ouvir
# estalos ou ver avisos de "fontes sem dado", suba para 30 ou 40.
latency_ms = 20

# Microfone na entrada 1 da Scarlett (duplicado nos dois lados).
[source mic]
type = capture
device = Focusrite
input_channel = 1

# Violão/guitarra na entrada 2 (descomente se usar).
# [source instrumento]
# type = capture
# device = Focusrite
# input_channel = 2

# DAW no Focusrite USB ASIO: plugin NovaonFocus Send no Master do FL Studio.
# [source daw]
# type = send
# channel = 1

# Só o jogo.
[source jogo]
type = app
exe = game.exe

# Só a música.
[source musica]
type = app
exe = Spotify.exe

# Discord separado, para poder tirar ou baixar na live.
[source discord]
type = app
exe = Discord.exe

# Alternativa: todo o áudio do PC, menos o Discord.
# [source pc]
# type = app_exclude
# exe = Discord.exe

# O que vai para a transmissão.
[bus live]
mic = 1.0
jogo = 0.8
musica = 0.3
discord = 0.0

# Faixas isoladas para a gravação (uma fonte do OBS para cada).
[bus mic]
mic = 1.0

[bus jogo]
jogo = 1.0
